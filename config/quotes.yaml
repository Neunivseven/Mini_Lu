# 待机语录默认配置（可提交）
# 用户增删与开关保存在 data/quotes.json（首次启动会从本文件初始化）

enabled: true
interval_seconds: 12   # 两次尝试的最短间隔（秒）
chance: 0.7            # 每次尝试时触发概率
display_ms: 9000       # 气泡展示时长

quotes:
  - "发呆也是一种工作状态～"
  - "要不要起来伸个懒腰？"
  - "今天也辛苦啦。"
  - "喝口水再继续吧。"
  - "我在这儿陪着你。"
  - "偶尔停下看看窗外也好。"
  - "事情一件一件来就好。"
  - "你已经很努力了。"
  - "休息不是偷懒，是充电。"
  - "我偷偷给你加了点好运。"
