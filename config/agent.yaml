# Agent 运行模式（可提交；本机覆盖可用 agent.local.yaml）
#
# mode:
#   auto          — 自动路由：简单走 ReAct，复杂走 Plan-and-Execute（推荐）
#   react         — 始终 ReAct
#   plan_execute  — 始终 Plan-and-Execute

mode: auto

router:
  # 启发式命中多少个「复杂信号」后直接走 plan（提高门槛，减少误进 plan）
  min_plan_signals: 2
  # 仅 1 个信号时，超过该字数才直接 plan；否则 ambiguous→默认 react
  long_text_chars: 200
  # 边界不清时是否用短 LLM 分类（无 tools）；分类提示已偏 react
  use_llm_when_ambiguous: false

planner:
  max_plan_steps: 8

executor:
  # 嵌套 ReAct 单步最大递归
  recursion_limit: 40

memory:
  # 回合结束后用 LLM 自动提取/整合长期记忆（langmem）。
  # 每次提取是一次额外模型调用，默认关闭；开启后受 min_interval_seconds 节流。
  auto_extract: false
  # 两次提取之间的最小间隔（秒）
  min_interval_seconds: 120
  # 单次送入提取的用户文本/回复各自的最大字符数
  max_chars: 4000
